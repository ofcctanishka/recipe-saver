<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Recipes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            height: 65px;
            background-color: #333333;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            margin-right: 35px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #dddddd;
        }

        /* Main Container */
        .main-container {
            display: flex;
            justify-content: center;
            padding: 40px 30px;
        }

        .saved-container {
            width: 700px;
        }

        .saved-title {
            font-size: 30px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 25px;
        }

        /* Recipe */
        .recipe-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .recipe-card a {
            text-decoration: none;
            color: #222222;
            font-size: 21px;
            font-weight: bold;
        }

        .recipe-card a:hover {
            color: #555555;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/">HOME</a>
        <a href="/saved/">SAVED</a>
    </nav>


    <!-- Main Content -->
    <main class="main-container">

        <div class="saved-container">

            <div class="saved-title">
                Saved Recipes
            </div>


            {% for recipe in recipes %}

                <div class="recipe-card">

                    <a href="#">
                        {{ recipe.name }}
                    </a>

                </div>

            {% empty %}

                <p>No recipes saved yet.</p>

            {% endfor %}

        </div>

    </main>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Maker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .navbar {
            height: 65px;
            background-color: #333333;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            margin-right: 35px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #dddddd;
        }

        /* Main Container */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 65px);
            padding: 30px;
        }

        /* Recipe Box */
        .recipe-box {
            background-color: white;
            width: 600px;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .recipe-box h1 {
            color: #333333;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .recipe-box p {
            color: #777777;
            margin-bottom: 30px;
        }

        /* Input */
        .recipe-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        .recipe-input:focus {
            border-color: #333333;
        }

        /* Make Recipe Button */
        .make-recipe-btn {
            background-color: #333333;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .make-recipe-btn:hover {
            background-color: #222222;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/">HOME</a>
        <a href="/saved/">SAVED</a>
    </nav>

    <!-- Main Content -->
    <main class="main-container">

        <div class="recipe-box">

            <h1>Make a Recipe</h1>

            <p>Enter the name of a dish you'd like to make.</p>

            <input
                type="text"
                id="recipeName"
                class="recipe-input"
                placeholder="Enter recipe name..."
            >

            <button class="make-recipe-btn" onclick="makeRecipe()">
                MAKE RECIPE
            </button>

        </div>

    </main>


    <script>
        function makeRecipe() {

            const recipeName = document.getElementById("recipeName").value;

            if (recipeName.trim() === "") {
                alert("Please enter a recipe name.");
                return;
            }

            window.location.href = "/add-recipe/?name=" + encodeURIComponent(recipeName);
        }
    </script>

</body>
</html>
